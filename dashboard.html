<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternForge | Student Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <style>
        :root {
            --brand: #0056d2;
            --brand-dark: #003f9e;
            --brand-soft: #eef4ff;
            --navy: #0f172a;
            --text: #111827;
            --muted: #64748b;
            --line: #e5e7eb;
            --bg: #f4f7fb;
            --card: #ffffff;
            --success-bg: #dcfce7;
            --success: #156534;
            --warning-bg: #fef3c7;
            --warning: #924000;
            --danger-bg: #fee2e2;
            --danger: #991b1b;
            --radius: 24px;
            --shadow: 0 16px 40px rgba(15, 23, 42, .08);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background: radial-gradient(circle at top left, #eaf2ff 0%, #f8fafc 38%, #eef4ff 100%);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(120deg, rgba(0, 86, 210, .08), transparent 35%, rgba(59, 130, 246, .08));
            pointer-events: none;
        }
        .sidebar {
            width: 275px;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(18px);
            border-right: 1px solid rgba(226, 232, 240, .8);
            padding: 24px 20px;
            position: fixed;
            height: 100vh;
            overflow: auto;
            z-index: 10;
            box-shadow: 8px 0 30px rgba(15, 23, 42, .04);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            padding: 10px;
            border-radius: 18px;
            background: #f8fafc;
            border: 1px solid #eaf0f8;
        }
        .logo img {
            height: 50px;
            width: 50px;
            border-radius: 14px;
            object-fit: cover;
        }
        .logo h2 {
            font-size: 25px;
            font-weight: 950;
            color: var(--brand);
            letter-spacing: -.5px;
            line-height: 1;
        }
        .logo span {
            display: block;
            font-size: 11px;
            color: var(--muted);
            font-weight: 800;
            margin-top: 4px;
            line-height: 1.2;
        }
        .menu-title {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #94a3b8;
            text-transform: uppercase;
            margin: 22px 8px 12px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 850;
            color: #334155;
            transition: .25s;
            margin-bottom: 8px;
            position: relative;
        }
        .nav-link i {
            width: 21px;
            text-align: center;
            font-size: 15px;
            color: #0f2d63;
        }
        .nav-link span {
            font-size: 15px;
        }
        .nav-link:hover {
            background: var(--brand-soft);
            color: var(--brand);
            transform: translateX(3px);
        }
        .nav-link.active {
            background: linear-gradient(135deg, #0056d2, #1d4ed8);
            color: #fff;
            box-shadow: 0 12px 28px rgba(0, 86, 210, .25);
        }
        .nav-link.active i, .nav-link.active span {
            color: #fff;
        }
        main, .main {
            margin-left: 275px;
            width: calc(100% - 275px);
            padding: 30px;
            position: relative;
            z-index: 1;
        }
        .section {
            display: none;
            animation: fadeSlide .35s ease;
            margin-top: 18px;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero {
            background: linear-gradient(135deg, #003f9e, #0056d2 55%, #3b82f6);
            color: white;
            padding: 38px;
            border-radius: 32px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 22px 55px rgba(0, 86, 210, .22);
            min-height: 210px;
            display: flex;
            align-items: center;
        }
        .hero::after {
            content: "";
            position: absolute;
            right: -75px;
            top: -95px;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .10);
        }
        .hero::before {
            content: "";
            position: absolute;
            right: 80px;
            bottom: -70px;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .07);
        }
        .hero-content {
            position: relative;
            z-index: 2;
        }
        .hero h1 {
            font-size: 40px;
            font-weight: 950;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .hero p {
            font-size: 16px;
            color: #dbeafe;
            max-width: 720px;
            line-height: 1.6;
            font-weight: 500;
        }
        .hero-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 24px;
        }
        .hero-btn {
            min-width: 175px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-weight: 950;
            text-decoration: none;
            transition: .25s;
        }
        .hero-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, .18);
        }
        .hero-primary {
            background: #fff;
            color: #0f172a;
        }
        .hero-secondary {
            background: rgba(255, 255, 255, .12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .65);
        }
        .card {
            background: rgba(255, 255, 255, .94);
            border: 1px solid rgba(226, 232, 240, .9);
            border-radius: var(--radius);
            padding: 26px;
            box-shadow: var(--shadow);
            margin-bottom: 22px;
        }
        .card-title {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 950;
            letter-spacing: .3px;
        }
        .card-text {
            color: var(--muted);
            line-height: 1.7;
            font-weight: 650;
        }
        .profile-box {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 26px;
            padding: 24px 28px;
            margin-top: 22px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .profile-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }
        .profile-top h3 {
            font-size: 20px;
            font-weight: 950;
            color: var(--navy);
        }
        .profile-percent {
            background: var(--brand-soft);
            color: var(--brand);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 950;
            white-space: nowrap;
        }
        .progress-bar {
            height: 14px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0056d2, #3b82f6, #60a5fa);
            border-radius: 999px;
            box-shadow: 0 0 18px rgba(59, 130, 246, .35);
            transition: width .55s ease;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }
        .stat-card {
            min-height: 128px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
            padding: 24px;
            border-radius: 25px;
            border: 1px solid #e5e7eb;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: .25s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #0056d2, #60a5fa);
        }
        .stat-card span {
            font-size: 12px;
            font-weight: 950;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .stat-card h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 950;
            color: var(--navy);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: max-content;
            max-width: 100%;
            padding: 9px 15px;
            border-radius: 999px;
            font-size: 14px !important;
            font-weight: 950 !important;
        }
        .status-warning { background: var(--warning-bg); color: var(--warning) !important; }
        .status-success { background: var(--success-bg); color: var(--success) !important; }
        .status-danger { background: var(--danger-bg); color: var(--danger) !important; }
        .status-neutral { background: #e0f2fe; color: #075985 !important; }

        .app-status-card { margin-top: 24px; }
        .app-status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 18px;
        }
        .app-status-item {
            background: #f8fafe;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 18px;
            transition: .25s;
        }
        .app-status-item:hover {
            background: #eef4ff;
            transform: translateY(-2px);
        }
        .app-status-item span {
            display: block;
            font-size: 12px;
            font-weight: 950;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .app-status-item b {
            font-size: 16px;
            font-weight: 950;
            color: var(--navy);
        }
        .quick-strip {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .quick-chip {
            background: #fff;
            border: 1px solid #e5e7eb;
            padding: 14px 16px;
            border-radius: 16px;
            font-weight: 950;
            box-shadow: 0 8px 20px rgba(15, 23, 42, .05);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quick-chip small {
            display: block;
            color: var(--muted);
            font-weight: 750;
            margin-top: 2px;
        }
        .quick-icon {
            height: 35px;
            width: 35px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #eef4ff;
            color: var(--brand);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }
        .section-kicker {
            font-size: 13px;
            color: var(--brand);
            font-weight: 950;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .internship-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 22px;
        }
        .intern-card {
            background: #fff;
            border: 1px solid #dbeafe;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(15, 23, 42, .08);
            transition: .25s;
            display: grid;
            grid-template-columns: 360px 1fr;
        }
        .intern-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 24px 58px rgba(15, 23, 42, .12);
        }
        .intern-img {
            min-height: 260px;
            position: relative;
            background: linear-gradient(rgba(0, 86, 210, .72), rgba(15, 23, 42, .72)), url('https://images.unsplash.com/photo-1516321318423-06f85e504b3?auto=format&fit=crop&w=1100&q=80');
            background-size: cover;
            background-position: center;
        }
        .intern-img span {
            position: absolute;
            top: 18px;
            right: 18px;
            background: #fff;
            color: #0f172a;
            padding: 9px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 950;
        }
        .intern-body { padding: 30px; }
        .intern-body h3 { font-size: 30px; margin-bottom: 10px; font-weight: 950; letter-spacing: .5px; }
        .intern-body p { color: #475569; line-height: 1.75; margin-bottom: 18px; font-weight: 650; }
        .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
        .tags b { background: #eef4ff; color: #0056d2; font-size: 12px; padding: 8px 11px; border-radius: 999px; }
        .price-line { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
        .price-line del { color: #94a3b8; font-weight: 900; }
        .price-line strong { font-size: 30px; color: #0056d2; }
        .program-points { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 18px 0; }
        .program-points div { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 14px; padding: 12px; font-weight: 850; color: #334155; }
        
        .primary-btn {
            background: linear-gradient(135deg, #0056d2, #1d4ed8);
            color: #fff;
            border: none;
            padding: 13px 18px;
            border-radius: 13px;
            font-weight: 950;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .25s;
        }
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 86, 210, .22);
        }
        .secondary-btn {
            background: #eef4ff;
            color: #0056d2;
            border: none;
            padding: 11px 15px;
            border-radius: 13px;
            font-weight: 900;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .25s;
        }
        .secondary-btn:hover { background: #dbeafe; }
        .button-row { display: flex; gap: 12px; flex-wrap: wrap; }
        
        .pricing-box {
            background: linear-gradient(135deg, #eef4ff, #fff);
            border: 1px solid #bfdbfe;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            margin: 18px 0;
        }
        .price-row { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .old-price { font-size: 24px; font-weight: 950; color: #94a3b8; text-decoration: line-through; }
        .new-price { font-size: 44px; font-weight: 950; color: #0056d2; }
        .offer-badge { display: inline-block; background: #dcfce7; color: #166534; padding: 8px 14px; border-radius: 999px; font-weight: 950; margin: 12px 0; }
        .timer-box { background: #0f172a; color: #fff; padding: 12px 16px; border-radius: 14px; font-weight: 950; display: inline-block; margin-top: 12px; }
        
        .payment-box { text-align: center; margin-top: 20px; background: #f8fafc; padding: 28px; border-radius: 24px; border: 1px solid #e5e7eb; }
        .payment-box img { width: 220px; background: white; padding: 12px; border-radius: 18px; border: 1px solid #e5e7eb; margin: 18px 0; }
        
        .input-field, .payment-box input, textarea { width: 100% ; padding: 15px; border: 1px solid #cbd5e1; border-radius: 14px; margin-top: 14px; font-size: 15px; outline: none; background: #fff; }
        .input-field:focus, .payment-box input:focus, textarea:focus { border-color: #0056d2; box-shadow: 0 0 0 4px rgba(0, 86, 210, .10); }
        
        .doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .doc-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 24px; padding: 25px; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: .25s; }
        .doc-card:hover { transform: translateY(-4px); }
        .doc-card::after { content: ""; position: absolute; right: -35px; top: -35px; width: 95px; height: 95px; background: #eef4ff; border-radius: 50%; }
        .doc-card i { font-size: 34px; color: #0056d2; margin-bottom: 14px; position: relative; z-index: 1; }
        .doc-card h3 { margin-bottom: 12px; font-size: 20px; }
        .doc-card p { color: #64748b; margin-top: 8px; font-weight: 650; }
        .doc-card b { color: #0f172a; }
        .doc-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
        
        .project-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .project-stat { padding: 18px; border-radius: 18px; border: 1px solid #e5e7eb; background: #fff; }
        .project-stat strong { display: block; font-size: 12px; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        .project-stat span { font-size: 18px; font-weight: 950; }
        .notice { background: #f8fafc; border-left: 4px solid #0056d2; padding: 16px; border-radius: 14px; margin-top: 14px; color: #374151; line-height: 1.6; }
        .guidelines-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
        .guideline { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; font-weight: 750; color: #334155; }
        
        .announcement-list { display: grid; gap: 14px; }
        .announcement-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; padding: 18px; box-shadow: 0 8px 22px rgba(15, 23, 42, .04); }
        .announcement-card h3 { font-size: 18px; margin-bottom: 8px; }
        .announcement-card p { color: #475569; line-height: 1.6; }
        .announcement-empty { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 18px; padding: 24px; color: #
