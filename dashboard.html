<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InternForge Dashboard</title>

<style>
body{background:#0f172a;color:white;font-family:Arial,sans-serif;margin:0;}
nav{background:#111827;padding:20px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:24px;font-weight:bold;color:#3b82f6;}
.logout{background:#ef4444;padding:10px 20px;border:none;border-radius:8px;color:white;cursor:pointer;}
.container{padding:40px;}
.card{background:#1e293b;padding:25px;border-radius:15px;margin-bottom:20px;}
.status{color:#facc15;font-weight:bold;}
</style>
</head>

<body>

<nav>
<div class="logo">InternForge</div>
<button class="logout" id="logoutBtn">Logout</button>
</nav>

<div class="container">

<div class="card">
<h2>Welcome, <span id="studentName">Student</span> 👋</h2>
<p><b>Email:</b> <span id="studentEmail">Loading...</span></p>
<p><b>College:</b> <span id="studentCollege">Loading...</span></p>
<p><b>Course:</b> <span id="studentCourse">Loading...</span></p>
</div>

<div class="card">
<h2>Internship Status</h2>
<p><b>Assigned Program:</b> <span class="status">Pending</span></p>
<p><b>Progress:</b> 0%</p>
<p><b>Payment:</b> Launch Offer ₹1</p>
</div>

<div class="card">
<h2>Certificate</h2>
<p>No certificate issued yet.</p>
</div>

</div>

<script type="module">
import { auth, db } from "./firebase-config.js";

import {
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  document.getElementById("studentEmail").innerText = user.email;

  const userDoc = await getDoc(doc(db, "students", user.uid));

  if (userDoc.exists()) {
    const data = userDoc.data();
    document.getElementById("studentName").innerText = data.name || "Student";
    document.getElementById("studentCollege").innerText = data.college || "Not Added";
    document.getElementById("studentCourse").innerText = data.course || "Not Added";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});
</script>

</body>
</html>
