<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payment Verification</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f5f7fb;
font-family:Arial,sans-serif;
}

.card{
background:white;
padding:40px;
border-radius:24px;
box-shadow:0 10px 40px rgba(0,0,0,.08);
text-align:center;
width:450px;
}

.loader{
width:80px;
height:80px;
border:8px solid #e5e7eb;
border-top:8px solid #2563eb;
border-radius:50%;
margin:auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

h2{
margin-top:25px;
color:#111827;
}

p{
color:#6b7280;
}

.timer{
font-size:32px;
font-weight:900;
color:#2563eb;
margin-top:20px;
}

.badge{
display:inline-block;
padding:8px 16px;
background:#fef3c7;
color:#92400e;
border-radius:999px;
font-weight:700;
margin-top:15px;
}

</style>
</head>

<body>

<div class="card">

<div class="loader"></div>

<h2>Waiting For Payment Approval</h2>

<p>
Your payment has been submitted successfully.
Admin verification is in progress.
</p>

<div class="badge">
Pending Approval
</div>

<div class="timer" id="timer">
05:00
</div>

</div>

<script>

let time=300;

const timer=document.getElementById("timer");

setInterval(()=>{

let minutes=Math.floor(time/60);
let seconds=time%60;

timer.innerText=
String(minutes).padStart(2,"0")
+":"
+String(seconds).padStart(2,"0");

time--;

if(time<0){

window.location.href="dashboard.html";

}

},1000);

</script>

</body>
</html>
