<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – InternForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563eb; --blue-dark: #1d4ed8; --blue-light: #eff6ff; --blue-mid: #dbeafe;
      --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
      --border: #e2e8f0; --white: #ffffff; --red: #dc2626; --green: #16a34a;
      --radius: 12px; --shadow: 0 4px 24px rgba(37,99,235,0.10);
    }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #eff6ff 0%, #ffffff 50%, #eff6ff 100%); min-height: 100vh; display: flex; flex-direction: column; }

    /* NAV */
    nav { background: white; border-bottom: 1px solid var(--border); padding: 0 5%; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-size: 1.15rem; font-weight: 800; color: var(--blue); text-decoration: none; }
    nav a.back { font-size: 0.85rem; color: var(--text-2); text-decoration: none; }
    nav a.back:hover { color: var(--blue); }

    /* LAYOUT */
    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .auth-card { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 44px 40px; width: 100%; max-width: 480px; box-shadow: var(--shadow); }
    .auth-head { text-align: center; margin-bottom: 32px; }
    .auth-head h1 { font-size: 1.7rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .auth-head p { font-size: 0.9rem; color: var(--text-2); }

    /* FORM */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 9px;
      font-family: inherit; font-size: 0.9rem; color: var(--text); background: white;
      outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-mid); }
    input.error { border-color: var(--red); }

    .btn-submit {
      width: 100%; padding: 13px; background: var(--blue); color: white; border: none;
      border-radius: 9px; font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 8px; transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--blue-dark); }
    .btn-submit:disabled { background: var(--text-3); cursor: not-allowed; }

    .msg { padding: 12px 14px; border-radius: 9px; font-size: 0.88rem; font-weight: 500; margin-bottom: 16px; display: none; }
    .msg.error { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; display: block; }
    .msg.success { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; display: block; }

    .auth-footer { text-align: center; margin-top: 22px; font-size: 0.87rem; color: var(--text-2); }
    .auth-footer a { color: var(--blue); font-weight: 600; text-decoration: none; }

    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-3); font-size: 0.82rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .trust-row { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    .trust-item { font-size: 0.78rem; color: var(--text-3); display: flex; align-items: center; gap: 4px; }

    @media (max-width: 500px) {
      .auth-card { padding: 30px 20px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">⚡ InternForge</a>
  <a href="login.html" class="back">Already have an account? Log in →</a>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-head">
      <h1>Create Your Account</h1>
      <p>Start your internship journey for just ₹1</p>
    </div>

    <div id="errorMsg" class="msg"></div>
    <div id="successMsg" class="msg"></div>

    <div class="form-row">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" placeholder="Rahul Sharma" required/>
      </div>
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" placeholder="rahul@gmail.com" required/>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password *</label>
      <input type="password" id="password" placeholder="Minimum 8 characters" required/>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="college">College / University *</label>
        <input type="text" id="college" placeholder="DU, VIT, BITS..." required/>
      </div>
      <div class="form-group">
        <label for="course">Course / Branch *</label>
        <input type="text" id="course" placeholder="B.Tech CSE, BCA..." required/>
      </div>
    </div>

    <div class="form-group">
      <label for="selectedProgram">Choose Internship Program *</label>
      <select id="selectedProgram" required>
        <option value="">— Select a Program —</option>
        <option value="AI & Prompt Engineering">🤖 AI & Prompt Engineering</option>
        <option value="Web Development">🌐 Web Development</option>
        <option value="Python Programming">🐍 Python Programming</option>
      </select>
    </div>

    <button class="btn-submit" id="signupBtn" onclick="handleSignup()">Create Account →</button>

    <div class="trust-row">
      <div class="trust-item">🔒 Secure signup</div>
      <div class="trust-item">✓ No spam</div>
      <div class="trust-item">✉️ Email verification sent</div>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in here</a>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { auth, db } from './firebase-config.js';
  import {
    createUserWithEmailAndPassword,
    sendEmailVerification
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    doc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  window.handleSignup = async function () {
    const btn = document.getElementById('signupBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    errorMsg.className = 'msg';
    successMsg.className = 'msg';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const college = document.getElementById('college').value.trim();
    const course = document.getElementById('course').value.trim();
    const selectedProgram = document.getElementById('selectedProgram').value;

    // Validate
    if (!name || !email || !password || !college || !course || !selectedProgram) {
      errorMsg.textContent = 'Please fill in all required fields.';
      errorMsg.className = 'msg error';
      return;
    }
    if (password.length < 8) {
      errorMsg.textContent = 'Password must be at least 8 characters.';
      errorMsg.className = 'msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      // Create Firebase Auth user
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Send email verification
      await sendEmailVerification(user);

      // Save student data to Firestore
      await setDoc(doc(db, 'students', user.uid), {
        name,
        email,
        college,
        course,
        selectedProgram,
        applicationStatus: 'Pending',
        paymentStatus: 'Unpaid',
        transactionId: '',
        progress: 0,
        offerLetterStatus: 'Not Issued',
        offerLetterId: '',
        certificateStatus: 'Not Issued',
        certificateId: '',
        completionLetterStatus: 'Not Issued',
        completionLetterId: '',
        createdAt: serverTimestamp()
      });

      successMsg.textContent = '✅ Account created! Please check your email to verify your address, then log in.';
      successMsg.className = 'msg success';
      btn.textContent = 'Account Created!';

      setTimeout(() => { window.location.href = 'login.html'; }, 3000);

    } catch (err) {
      let msg = 'Signup failed. Please try again.';
      if (err.code === 'auth/email-already-in-use') msg = 'This email is already registered. Please log in.';
      if (err.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
      if (err.code === 'auth/weak-password') msg = 'Password is too weak. Use at least 8 characters.';
      errorMsg.textContent = msg;
      errorMsg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = 'Create Account →';
    }
  };
</script>

</body>
</html>
