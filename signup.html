
<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InternForge Signup</title><style>
body{
background:#0f172a;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1e293b;
padding:30px;
border-radius:15px;
width:350px;
}

h2{
color:white;
text-align:center;
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

p{
text-align:center;
margin-top:10px;
color:white;
}

a{
color:#60a5fa;
}
</style></head><body><div class="container">
<h2>Create Account</h2><input type="text" id="name" placeholder="Full Name">
<input type="text" id="college" placeholder="College Name"><select id="course">
<option>BCA</option>
<option>BTech</option>
<option>BBA</option>
<option>Other</option>
</select><input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password"><button id="signupBtn">Sign Up</button>

<p>Already have an account?
<a href="login.html">Login</a>
</p>
</div><script type="module">

import { auth, db } from "./firebase-config.js";

import {
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

document.getElementById("signupBtn")
.addEventListener("click", async () => {

const name = document.getElementById("name").value;
const college = document.getElementById("college").value;
const course = document.getElementById("course").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(db,"students",userCredential.user.uid),
{
name,
college,
course,
email,
createdAt:new Date()
}
);

alert("Account Created Successfully!");

window.location.href="login.html";

}catch(error){
alert(error.message);
}

});

</script></body>
</html>
