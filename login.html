<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InternForge Login</title><style>
body{
background:#0f172a;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1e293b;
padding:30px;
border-radius:15px;
width:350px;
}

h2{
color:white;
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

p{
text-align:center;
margin-top:10px;
color:white;
}

a{
color:#60a5fa;
}
</style></head><body><div class="container">
<h2>Login</h2><input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password"><button id="loginBtn">Login</button>

<p>
Don't have an account?
<a href="signup.html">Sign Up</a>
</p>
</div><script type="module">

import { auth } from "./firebase-config.js";

import {
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

document.getElementById("loginBtn")
.addEventListener("click", async () => {

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

alert("Login Successful!");

window.location.href="dashboard.html";

}catch(error){
alert(error.message);
}

});

</script></body>
</html>
