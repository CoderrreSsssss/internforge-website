<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log In – InternForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563eb; --blue-dark: #1d4ed8; --blue-light: #eff6ff; --blue-mid: #dbeafe;
      --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
      --border: #e2e8f0; --white: #ffffff; --red: #dc2626; --green: #16a34a;
      --radius: 12px; --shadow: 0 4px 24px rgba(37,99,235,0.10);
    }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #eff6ff 0%, #ffffff 50%, #eff6ff 100%); min-height: 100vh; display: flex; flex-direction: column; }

    nav { background: white; border-bottom: 1px solid var(--border); padding: 0 5%; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-size: 1.15rem; font-weight: 800; color: var(--blue); text-decoration: none; }
    nav a.back { font-size: 0.85rem; color: var(--text-2); text-decoration: none; }
    nav a.back:hover { color: var(--blue); }

    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .auth-card { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow); }
    .auth-head { text-align: center; margin-bottom: 32px; }
    .auth-head h1 { font-size: 1.8rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .auth-head p { font-size: 0.9rem; color: var(--text-2); }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 9px;
      font-family: inherit; font-size: 0.92rem; color: var(--text); background: white;
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-mid); }

    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .label-row a { font-size: 0.8rem; color: var(--blue); text-decoration: none; font-weight: 500; }

    .btn-submit {
      width: 100%; padding: 13px; background: var(--blue); color: white; border: none;
      border-radius: 9px; font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 8px; transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--blue-dark); }
    .btn-submit:disabled { background: var(--text-3); cursor: not-allowed; }

    .msg { padding: 12px 14px; border-radius: 9px; font-size: 0.88rem; font-weight: 500; margin-bottom: 16px; display: none; }
    .msg.error { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; display: block; }
    .msg.success { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; display: block; }
    .msg.info { background: var(--blue-light); color: var(--blue); border: 1px solid var(--blue-mid); display: block; }

    .auth-footer { text-align: center; margin-top: 24px; font-size: 0.87rem; color: var(--text-2); }
    .auth-footer a { color: var(--blue); font-weight: 600; text-decoration: none; }

    .admin-link { text-align: center; margin-top: 16px; }
    .admin-link a { font-size: 0.8rem; color: var(--text-3); text-decoration: none; }
    .admin-link a:hover { color: var(--blue); }

    @media (max-width: 500px) { .auth-card { padding: 30px 20px; } }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">⚡ InternForge</a>
  <a href="signup.html" class="back">New here? Sign up →</a>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-head">
      <h1>Welcome Back 👋</h1>
      <p>Log in to access your student dashboard</p>
    </div>

    <div id="errorMsg" class="msg"></div>
    <div id="successMsg" class="msg"></div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="rahul@gmail.com" required/>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="password">Password</label>
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>
      <input type="password" id="password" placeholder="Enter your password" required/>
    </div>

    <button class="btn-submit" id="loginBtn" onclick="handleLogin()">Log In →</button>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign up for free</a>
    </div>

    <div class="admin-link">
      <a href="admin.html">Admin Panel →</a>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { auth } from './firebase-config.js';
  import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Redirect if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.email === 'dhruvkhuranaa2006@gmail.com') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  });

  window.handleLogin = async function () {
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    errorMsg.className = 'msg';
    successMsg.className = 'msg';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      errorMsg.textContent = 'Please enter your email and password.';
      errorMsg.className = 'msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      successMsg.textContent = '✅ Login successful! Redirecting...';
      successMsg.className = 'msg success';

      setTimeout(() => {
        if (user.email === 'dhruvkhuranaa2006@gmail.com') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 800);

    } catch (err) {
      let msg = 'Login failed. Please try again.';
      if (err.code === 'auth/user-not-found') msg = 'No account found with this email.';
      if (err.code === 'auth/wrong-password') msg = 'Incorrect password. Please try again.';
      if (err.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
      if (err.code === 'auth/too-many-requests') msg = 'Too many failed attempts. Please try later.';
      if (err.code === 'auth/invalid-credential') msg = 'Invalid email or password.';
      errorMsg.textContent = msg;
      errorMsg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = 'Log In →';
    }
  };

  // Forgot password
  document.getElementById('forgotLink').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    errorMsg.className = 'msg';
    successMsg.className = 'msg';

    if (!email) {
      errorMsg.textContent = 'Enter your email address above first.';
      errorMsg.className = 'msg error';
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      successMsg.textContent = '✅ Password reset email sent. Check your inbox.';
      successMsg.className = 'msg success';
    } catch (err) {
      errorMsg.textContent = 'Failed to send reset email. Check your address.';
      errorMsg.className = 'msg error';
    }
  });
</script>

</body>
</html>
