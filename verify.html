<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify Document | InternForge</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#f5f7fb;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
}

.verify-card{
width:100%;
max-width:700px;
background:white;
border-radius:28px;
padding:35px;
box-shadow:0 25px 60px rgba(0,0,0,.08);
border:1px solid #e5e7eb;
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo img{
width:80px;
height:80px;
object-fit:contain;
}

.logo h1{
color:#0056d2;
margin-top:10px;
}

.logo p{
color:#64748b;
font-size:14px;
}

.search-box{
margin-top:25px;
}

input{
width:100%;
padding:16px;
border:1px solid #cbd5e1;
border-radius:14px;
font-size:16px;
outline:none;
}

button{
width:100%;
margin-top:14px;
background:#0056d2;
color:white;
border:none;
padding:16px;
border-radius:14px;
font-weight:900;
cursor:pointer;
}

.result{
display:none;
margin-top:25px;
padding:20px;
border-radius:16px;
background:#f8fafc;
border:1px solid #e5e7eb;
}

.status{
font-size:18px;
font-weight:900;
margin-bottom:15px;
}

.valid{
color:#16a34a;
}

.invalid{
color:#dc2626;
}

.info-row{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #e5e7eb;
}

.info-row span{
color:#64748b;
}

</style>
</head>

<body>

<div class="verify-card">

<div class="logo">
<img src="logo.png" onerror="this.style.display='none'">
<h1>InternForge Verification Portal</h1>
<p>Verify Offer Letters, Certificates and Completion Letters</p>
</div>

<div class="search-box">

<input
id="verifyId"
placeholder="Enter Certificate / Offer Letter / Completion ID">

<button id="verifyBtn">
Verify Document
</button>

</div>

<div id="resultBox" class="result">

<div id="statusText" class="status">
Checking...
</div>

<div class="info-row">
<span>Student Name</span>
<b id="studentName">-</b>
</div>

<div class="info-row">
<span>Program</span>
<b id="programName">-</b>
</div>

<div class="info-row">
<span>Document Type</span>
<b id="documentType">-</b>
</div>

<div class="info-row">
<span>Document ID</span>
<b id="documentId">-</b>
</div>

<div class="info-row">
<span>Status</span>
<b id="documentStatus">-</b>
</div>

</div>

</div>



<script type="module">

import { db } from "./firebase-config.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const verifyBtn =
document.getElementById("verifyBtn");

verifyBtn.addEventListener("click", verifyDocument);

async function verifyDocument(){

const id =
document.getElementById("verifyId")
.value
.trim();

if(!id){
alert("Enter Document ID");
return;
}

const resultBox =
document.getElementById("resultBox");

resultBox.style.display="block";

document.getElementById("statusText").innerHTML =
"Checking...";

const snapshot =
await getDocs(collection(db,"students"));

let found = false;

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

const offerId =
data.offerLetterId || "";

const certificateId =
data.certificateId || "";

const completionId =
data.completionLetterId || "";

if(
id === offerId ||
id === certificateId ||
id === completionId
){

found = true;

let docType = "Unknown";

if(id === offerId)
docType = "Offer Letter";

if(id === certificateId)
docType = "Certificate";

if(id === completionId)
docType = "Completion Letter";

document.getElementById("statusText")
.innerHTML =
"✅ VERIFIED";

document.getElementById("statusText")
.className =
"status valid";

document.getElementById("studentName")
.innerText =
data.name || "-";

document.getElementById("programName")
.innerText =
data.selectedProgram || "-";

document.getElementById("documentType")
.innerText =
docType;

document.getElementById("documentId")
.innerText =
id;

document.getElementById("documentStatus")
.innerText =
"Valid";

}

});

if(!found){

document.getElementById("statusText")
.innerHTML =
"❌ DOCUMENT NOT FOUND";

document.getElementById("statusText")
.className =
"status invalid";

document.getElementById("studentName")
.innerText = "-";

document.getElementById("programName")
.innerText = "-";

document.getElementById("documentType")
.innerText = "-";

document.getElementById("documentId")
.innerText = "-";

document.getElementById("documentStatus")
.innerText = "Invalid";

}

}

</script>

</body>
</html>
