<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate | InternForge</title><style>
body{
background:#0b1120;
color:white;
font-family:Segoe UI,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#1e293b;
padding:35px;
border-radius:20px;
width:400px;
text-align:center;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
}

button{
margin-top:15px;
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:700;
cursor:pointer;
}

#result{
margin-top:20px;
}
</style></head><body><div class="box"><h2>Certificate Verification</h2><p>Enter Certificate ID</p><input
type="text"
id="certificateId"
placeholder="IF-2026-001"

«»

<button onclick="verifyCertificate()">
Verify Certificate
</button><div id="result"></div></div><script type="module">

import { db } from "./firebase-config.js";

import {
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.verifyCertificate = async function(){

const certId =
document.getElementById("certificateId").value;

const q = query(
collection(db,"students"),
where("certificateId","==",certId)
);

const snapshot = await getDocs(q);

if(snapshot.empty){

document.getElementById("result").innerHTML =
"<p style='color:red;'>Certificate Not Found</p>";

}else{

const data = snapshot.docs[0].data();

document.getElementById("result").innerHTML = `
<p style="color:#22c55e;">
✅ Verified Certificate
</p>

<p><b>Name:</b> ${data.name}</p>
<p><b>Course:</b> ${data.course}</p>
<p><b>Program:</b> ${data.selectedProgram || "Internship"}</p>
`;

}

}

</script></body>
</html>
