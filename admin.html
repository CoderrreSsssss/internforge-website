<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InternForge Admin Panel</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

h1{
margin-bottom:20px;
}

.student{
background:#1e293b;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

button{
background:#ef4444;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
margin-bottom:20px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>InternForge Admin Panel</h1>
<button id="logoutBtn">Logout</button>

<div id="studentList">Checking admin access...</div>

<script type="module">
import { auth, db } from "./firebase-config.js";

import {
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const ADMIN_EMAIL = "dhruvkhuranaa2006@gmail.com";
const studentList = document.getElementById("studentList");

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Please login first");
    window.location.href = "login.html";
    return;
  }

  if (user.email !== ADMIN_EMAIL) {
    alert("Access Denied. You are not admin.");
    window.location.href = "dashboard.html";
    return;
  }

  loadStudents();
});

async function loadStudents(){
  try{
    studentList.innerHTML = "";

    const snapshot = await getDocs(collection(db,"students"));

    if(snapshot.empty){
      studentList.innerHTML = "No students found";
      return;
    }

    snapshot.forEach((doc)=>{
      const data = doc.data();

      studentList.innerHTML += `
        <div class="student">
          <h3>${data.name || "No Name"}</h3>
          <p>Email: ${data.email || ""}</p>
          <p>College: ${data.college || ""}</p>
          <p>Course: ${data.course || ""}</p>
        </div>
      `;
    });

  }catch(error){
    studentList.innerHTML = "Error: " + error.message;
  }
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});
</script>

</body>
</html>
