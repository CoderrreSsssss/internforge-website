<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InternForge Admin Panel</title>

<style>
body{background:#0f172a;color:white;font-family:Arial,sans-serif;padding:20px;}
.student{background:#1e293b;padding:15px;border-radius:10px;margin-bottom:15px;}
button{background:#2563eb;color:white;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;margin-top:10px;}
.logout{background:#ef4444;}
select{padding:10px;border-radius:8px;margin-top:10px;width:100%;}
</style>
</head>

<body>

<h1>InternForge Admin Panel</h1>
<button class="logout" id="logoutBtn">Logout</button>

<div id="studentList">Checking admin access...</div>

<script type="module">
import { auth, db } from "./firebase-config.js";

import {
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
collection,
getDocs,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const ADMIN_EMAIL = "dhruvkhuranaa2006@gmail.com";
const studentList = document.getElementById("studentList");

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Please login first");
    window.location.href = "login.html";
    return;
  }

  if (user.email !== ADMIN_EMAIL) {
    alert("Access Denied. You are not admin.");
    window.location.href = "dashboard.html";
    return;
  }

  loadStudents();
});

async function loadStudents(){
  studentList.innerHTML = "";

  const snapshot = await getDocs(collection(db,"students"));

  if(snapshot.empty){
    studentList.innerHTML = "No students found";
    return;
  }

  snapshot.forEach((studentDoc)=>{
    const data = studentDoc.data();
    const id = studentDoc.id;

    studentList.innerHTML += `
      <div class="student">
        <h3>${data.name || "No Name"}</h3>
        <p><b>Email:</b> ${data.email || ""}</p>
        <p><b>College:</b> ${data.college || ""}</p>
        <p><b>Course:</b> ${data.course || ""}</p>
        <p><b>Assigned Program:</b> ${data.assignedProgram || "Pending"}</p>

        <select id="program-${id}">
          <option value="AI & Prompt Engineering">AI & Prompt Engineering</option>
          <option value="Web Development">Web Development</option>
          <option value="Python Programming">Python Programming</option>
          <option value="Data Science">Data Science</option>
        </select>

        <button onclick="assignProgram('${id}')">Assign Internship</button>
      </div>
    `;
  });
}

window.assignProgram = async function(id){
  const program = document.getElementById("program-" + id).value;

  await updateDoc(doc(db, "students", id), {
    assignedProgram: program,
    progress: 0,
    certificateStatus: "Not Issued"
  });

  alert("Internship assigned successfully!");
  loadStudents();
};

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});
</script>

</body>
</html>
